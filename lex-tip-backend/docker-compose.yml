services:
  libretranslate:
    image: libretranslate/libretranslate:v1.6.0
    container_name: lextip-libretranslate
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      LT_LOAD_ONLY: ${LT_LOAD_ONLY:-en,ru}
      LT_DISABLE_WEB_UI: ${LT_DISABLE_WEB_UI:-true}
      LT_UPDATE_MODELS: ${LT_UPDATE_MODELS:-true}
      LT_HOST: 0.0.0.0
      LT_PORT: 5000
      # LT_API_KEYS: ${LT_API_KEYS:-}
    # Uncomment to persist the API-key database between local restarts.
    # volumes:
    #   - libretranslate-data:/data
    # environment:
    #   LT_API_KEYS_DB_PATH: /data/api_keys.db

# volumes:
#   libretranslate-data:
