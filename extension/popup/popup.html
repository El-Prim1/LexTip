<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>LexTip Settings</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      box-sizing: border-box;
    }

    h2 {
      font-size: 15px;
      margin-top: 0;
      margin-bottom: 8px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    p {
      color: #94a3b8;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .status {
      padding: 8px 12px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #cbd5e1;
      font-family: ui-monospace, monospace;
      font-size: 11px;
      margin-bottom: 14px;
    }

    .settings-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .settings-label {
      color: #94a3b8;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .settings-select {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
      transition: border-color 120ms ease;
    }

    .settings-select:hover {
      border-color: #475569;
    }

    .settings-select:focus {
      border-color: #38bdf8;
    }

    .settings-select option:disabled {
      color: #64748b;
      background: #0f172a;
    }
  </style>
</head>

<body>
  <h2>LexTip</h2>
  <p>Instant 3-layer text translation & linguistic analysis with closed Shadow DOM isolation.</p>

  <div class="settings-group">
    <label for="source-lang-select" class="settings-label">Source Language</label>
    <select id="source-lang-select" class="settings-select" aria-label="Source Language"></select>
  </div>

  <div class="settings-group">
    <label for="target-lang-select" class="settings-label">Target Language</label>
    <select id="target-lang-select" class="settings-select" aria-label="Target Language"></select>
  </div>

  <script src="popup.js"></script>
</body>

</html>
