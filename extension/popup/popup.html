<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LexTip Settings</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }
    h2 {
      font-size: 15px;
      margin-bottom: 8px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    p {
      color: #94a3b8;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .status {
      padding: 8px 12px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #cbd5e1;
      font-family: ui-monospace, monospace;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <h2>LexTip</h2>
  <p>Instant 3-layer text translation & linguistic analysis with closed Shadow DOM isolation.</p>
  <div class="status">Status: Active (Phase 1 Ready)</div>
</body>
</html>
