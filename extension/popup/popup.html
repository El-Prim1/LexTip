<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>LexTip Settings</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #171b24;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      font-size: 13px;
      line-height: 1.4;
    }

    h2 {
      margin: 0 0 5px;
      color: #eef2f8;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
    }

    p {
      margin: 0 0 14px;
      color: #8994a7;
      font-size: 12px;
      line-height: 1.5;
    }

    .settings-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }

    .settings-group:last-of-type {
      margin-bottom: 0;
    }

    .settings-label {
      color: #8994a7;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .settings-select {
      width: 100%;
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid #343b49;
      border-radius: 6px;
      background: #232936;
      color: #cbd5e1;
      font: inherit;
      cursor: pointer;
      outline: none;
      transition: border-color 100ms ease, color 100ms ease;
    }

    .settings-select:hover {
      border-color: #4b5565;
      color: #f8fafc;
    }

    .settings-select:focus-visible {
      border-color: #8eb9ed;
      outline: 1px solid #8eb9ed;
      outline-offset: 1px;
    }

    .settings-select option:disabled {
      color: #556075;
      background: #171b24;
    }

    @media (prefers-reduced-motion: reduce) {
      .settings-select {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <h2>LexTip</h2>
  <p>Instant 3-layer text translation & linguistic analysis with closed Shadow DOM isolation.</p>

  <div class="settings-group">
    <label for="source-lang-select" class="settings-label">Source Language</label>
    <select id="source-lang-select" class="settings-select" aria-label="Source Language"></select>
  </div>

  <div class="settings-group">
    <label for="target-lang-select" class="settings-label">Target Language</label>
    <select id="target-lang-select" class="settings-select" aria-label="Target Language"></select>
  </div>

  <script src="popup.js"></script>
</body>

</html>
